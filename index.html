<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdullah Pk's Blog</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=MedievalSharp&family=Tangerine:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Fixed Header -->
  <header class="header-container">
    <div class="header-content">
      <h1 class="logo">Abdullah Pk's Blog</h1>
      <nav id="navLinks">
        <!-- Dynamically rendered via app.js -->
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    <div class="book-cover-frame">
      <div class="page-container" id="postsContainer">
        <!-- Blog posts load here dynamically -->
      </div>
      <div class="pagination" id="paginationControls"></div>
    </div>
  </main>

  <!-- Fixed-width Footer -->
  <footer class="footer-container">
    <div class="footer-content">
      <p>&copy; 2026 Abdullah Pk's Blog. Preserved in Antiquity.</p>
    </div>
  </footer>

  <!-- Auth Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content parchment">
      <span class="close-btn" onclick="window.toggleAuthModal()">&times;</span>
      <h2>Scribe Authentication</h2>
      
      <!-- Email / Password Form -->
      <form id="emailAuthForm">
        <input type="email" id="authEmail" placeholder="Email Address" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="button" onclick="window.handleEmailSignUp()">Register with Email</button>
        <button type="button" onclick="window.handleEmailSignIn()">Sign In with Email</button>
      </form>

      <hr>

      <!-- Phone / OTP Form -->
      <form id="phoneAuthForm">
        <input type="tel" id="phoneNumber" placeholder="+1234567890">
        <button type="button" id="sendOtpBtn" onclick="window.handleSendOTP()">Send OTP</button>
        <div id="recaptcha-container"></div>

        <div id="otpSection" class="hidden">
          <input type="text" id="otpCode" placeholder="Enter 6-digit OTP">
          <button type="button" onclick="window.handleVerifyOTP()">Verify OTP</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Write Blog Modal -->
  <div id="postModal" class="modal hidden">
    <div class="modal-content parchment">
      <span class="close-btn" onclick="window.togglePostModal()">&times;</span>
      <h2>Write New Manuscript</h2>
      <input type="text" id="newPostTitle" placeholder="Manuscript Title">
      <textarea id="newPostBody" rows="8" placeholder="Inscribe your thoughts..."></textarea>
      <button onclick="window.submitNewPost()">Publish Manuscript</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
