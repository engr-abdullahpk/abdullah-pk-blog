<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdullah Pk's Blog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=MedievalSharp&family=Tangerine:wght@700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Fixed Header -->
  <header class="header-container">
    <div class="header-content">
      <h1 class="logo">Abdullah Pk's Blog</h1>
      <nav id="navLinks">
        <!-- Dynamically rendered via app.js -->
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    <div class="book-cover-frame">
      <div class="page-container" id="postsContainer">
        <!-- Blog posts load here dynamically -->
      </div>
      <div class="pagination" id="paginationControls"></div>
    </div>
  </main>

  <!-- Fixed Footer -->
  <footer class="footer-container">
    <div class="footer-content">
      <p>&copy; 2026 Abdullah Pk's Blog. Preserved in Antiquity.</p>
    </div>
  </footer>

  <!-- Scribe Auth Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content parchment">
      <span class="close-btn" onclick="window.toggleAuthModal()">&times;</span>
      <h2>Scribe Authentication</h2>
      <input type="email" id="authEmail" placeholder="Email Address">
      <input type="password" id="authPassword" placeholder="Password">
      <button onclick="window.handleRegister()">Register</button>
      <button onclick="window.handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- Write Manuscript Modal -->
  <div id="writeModal" class="modal hidden">
    <div class="modal-content parchment">
      <span class="close-btn" onclick="window.toggleWriteModal()">&times;</span>
      <h2>Write New Manuscript</h2>
      <input type="text" id="postTitle" placeholder="Manuscript Title">
      <textarea id="postBody" rows="6" placeholder="Inscribe your thoughts..."></textarea>
      <button onclick="window.handlePublish()">Publish Manuscript</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
